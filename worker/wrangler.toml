name = "portfolio-media"
main = "src/index.js"
compatibility_date = "2026-09-18"
workers_dev = true

routes = [
  { pattern = "kensym15.dpdns.org", custom_domain = true }
]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "video"

[[r2_buckets]]
binding = "photo"
bucket_name = "photo"
remote = true

[images]
binding = "IMAGES"

[[ratelimits]]
name = "PHOTO_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[vars]
ALLOWED_ORIGINS = "https://kensym15.dpdns.org,https://shouraisan.github.io,http://127.0.0.1:5173,http://localhost:5173"
PORTFOLIO_ORIGIN = "https://shouraisan.github.io/portfolio/"
