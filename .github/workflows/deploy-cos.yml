name: Deploy to Tencent COS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sync_delete:
        description: '部署后删除 COS 上多余的旧文件（需子用户具备 cos:DeleteObject 权限）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cos-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 不指定 version：版本由 package.json 的 packageManager 字段决定
          # （"pnpm@11.19.0"）。同时指定两处会让 action 直接报
          # "Multiple versions of pnpm specified" 并中止。
          # 同时关闭它自带的 install，统一由下面的 Build 步骤执行，
          # 以便使用 --frozen-lockfile。
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        env:
          VITE_MEDIA_BASE_URL: ${{ vars.VITE_MEDIA_BASE_URL }}

      - name: Install coscmd
        run: python3 -m pip install --upgrade coscmd

      - name: Upload to COS
        env:
          SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          # 桶名与地域优先取 Secrets；未配置时回落到香港（站点桶）。
          # 香港（ap-hongkong）无需 ICP 备案即可绑定自定义域名。
          #
          # 部署目标切换方式（无需改本文件）：
          #   用香港桶做站点： TENCENT_COS_BUCKET=kensym-1331415098  TENCENT_COS_REGION=ap-hongkong
          #   用上海桶做站点： TENCENT_COS_BUCKET=photo-1331415098   TENCENT_COS_REGION=ap-shanghai
          BUCKET: ${{ secrets.TENCENT_COS_BUCKET || 'kensym-1331415098' }}
          REGION: ${{ secrets.TENCENT_COS_REGION || 'ap-hongkong' }}
          INPUT_SYNC_DELETE: ${{ inputs.sync_delete }}
        run: |
          set -euo pipefail

          # 注意：本步骤的环境变量名是 SECRET_ID / SECRET_KEY / BUCKET / REGION
          # （由上面的 env: 映射而来），不要用 GitHub 上的 Secret 名去读。
          # BUCKET / REGION 已有默认值，所以只需校验密钥两项。
          missing=""
          [ -z "${SECRET_ID:-}" ]  && missing="$missing TENCENT_CLOUD_SECRET_ID"
          [ -z "${SECRET_KEY:-}" ] && missing="$missing TENCENT_CLOUD_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "::error::以下 Secrets 未配置或为空:$missing"
            echo "::error::请在仓库 Settings → Secrets and variables → Actions 的 Secrets 页签中添加（注意不是 Variables 页签）。"
            exit 1
          fi

          # GitHub 不会自动去掉首尾空白，带空格/换行的值会让 coscmd 报 AccessDenied。
          # 只回显 Secret 名称，不回显值本身。
          blank=""
          for pair in "SECRET_ID:TENCENT_CLOUD_SECRET_ID" "SECRET_KEY:TENCENT_CLOUD_SECRET_KEY" "BUCKET:TENCENT_COS_BUCKET" "REGION:TENCENT_COS_REGION"; do
            var="${pair%%:*}"
            name="${pair##*:}"
            eval "value=\${$var}"
            trimmed="${value#"${value%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            if [ "$value" != "$trimmed" ]; then
              blank="$blank $name"
            fi
          done
          if [ -n "$blank" ]; then
            echo "::error::以下 Secrets 首尾含空格/Tab/换行，请重新编辑去掉:$blank"
            exit 1
          fi

          case "$REGION" in
            ap-*) ;;
            *) echo "::warning::COS 地域 '$REGION' 不常见，请确认填写正确（广州为 ap-guangzhou，上海为 ap-shanghai）" ;;
          esac
          case "$BUCKET" in
            *-*) ;;
            *) echo "::warning::桶名 '$BUCKET' 不含 APPID，COS 桶名应为“名称-APPID”全称" ;;
          esac

          coscmd config -a "${SECRET_ID}" -s "${SECRET_KEY}" -b "${BUCKET}" -r "${REGION}"

          echo "::group::本地待上传文件（dist 目录树）"
          find ./dist -type f | sort
          echo "文件总数: $(find ./dist -type f | wc -l)  总字节: $(du -sb ./dist | cut -f1)"
          echo "::endgroup::"

          # 按文件类型分别上传，以便对不同类型设置不同缓存策略。
          #
          # 不要加 -s（sync）！coscmd 的 sync 会按「同名同内容」直接跳过文件，
          # 连对象元数据都不更新，导致新增的 Cache-Control 永远写不进去
          # （现象：站点内容正常，但缓存头始终为空）。
          # dist 只有约 283 KB，全量重传的代价可以忽略；正确性优先。
          #
          # -H 的取值经查 coscmd 源码确认：cos_comm.py 的 maplist 里存在
          # 'Cache-Control': 'CacheControl' 映射，因此会真正作用到 PUT 请求；
          # 未在映射表中的头会被放进 x-cos-meta-*，不会成为缓存头。
          #
          # -d 打开 debug 日志，让每个文件的上传过程可见；-y 跳过交互确认。
          echo "::group::上传 assets（内容哈希文件名，可长期强缓存）"
          coscmd -d upload -r ./dist/assets/ /assets/ -y -H '{"Cache-Control":"public, max-age=31536000, immutable"}'
          echo "::endgroup::"

          # 字体显式指定 Content-Type：COS 的扩展名→MIME 默认表里没有 .woff2，
          # 不指定实测会以 application/octet-stream 提供。严格说这不致命（font/* 的要求
          # 只对跨源字体生效，而字体与页面同源），但「靠浏览器宽容度」的假设不值得留。
          echo "::group::上传字体（显式 font/woff2 + 长期强缓存）"
          coscmd -d upload -r ./dist/assets/ /assets/ -y --include '*.woff2' -H '{"Cache-Control":"public, max-age=31536000, immutable", "Content-Type":"font/woff2"}'
          echo "::endgroup::"

          echo "::group::上传 favicon（文件名不含哈希，用中等缓存）"
          coscmd -d upload -r ./dist/favicon.svg /favicon.svg -y -H '{"Cache-Control":"public, max-age=86400"}'
          echo "::endgroup::"

          echo "::group::上传 HTML（入口文件，必须不缓存）"
          coscmd -d upload -r ./dist/ / --include '*.html' -y -H '{"Cache-Control":"no-cache"}'
          echo "::endgroup::"

          # 可选：删除 COS 上多余的历史文件。
          # 默认关闭；关闭时绝不执行任何删除动作。
          # 注意：这一项依赖子用户具备 cos:DeleteObject 权限，
          #       用第三步的「最小权限方案 B」会因缺少该权限而失败。
          if [ "${INPUT_SYNC_DELETE:-false}" = "true" ]; then
            echo "::group::同步删除多余旧文件（sync_delete=true）"
            if coscmd -d upload -rs ./dist/ / --delete -y; then
              echo "::notice::旧文件清理完成"
            else
              echo "::error::清理失败：子用户可能缺少 cos:DeleteObject 权限。"
              echo "::error::请在 CAM 策略中加入 cos:DeleteObject 后重试，或把 sync_delete 改回 false。"
              rm -f ~/.cos.conf
              exit 1
            fi
            echo "::endgroup::"
          else
            echo "::notice::未启用 sync_delete，跳过旧文件清理（COS 上可能保留历史版本的文件）"
          fi

          echo "::group::上传后桶内对象（coscmd list）"
          if ! coscmd list -a -r; then
            echo "::warning::coscmd list 执行失败，无法列出对象"
          fi
          echo "::endgroup::"

          # 以 COS 侧的真实 HTTP 响应验证具体对象的可达性（而不是只信 coscmd 的自述结果）。
          # HTML 只探测静态网站端点：默认端点对浏览器会触发下载，不参与判定。
          site="https://${BUCKET}.cos-website.${REGION}.myqcloud.com"
          echo "静态网站端点: ${site}"

          html_ok=1
          html_failed=""
          # 页面已改为「目录 + index.html」形式，线上地址无 .html 后缀。
          # 这里必须跟着改，否则每次部署都会误报「页面不可达」。
          for page in "" "photography/" "capabilities/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${site}/${page}" || echo "000")
            echo "  /${page} -> HTTP ${code}"
            if [ "$code" != "200" ]; then
              html_ok=0
              html_failed="${html_failed} /${page}(${code})"
            fi
          done

          # 资源用默认端点读取，因为 coscmd 设置的缓存头只有在服务端真实返回时才算生效。
          asset_ok=0
          assets_checked=0
          assets_with_cache=0
          asset_lines=""
          for f in $(find ./dist/assets -type f \( -name '*.js' -o -name '*.css' \) | head -3); do
            key="${f#./dist/}"
            meta=$(curl -s -o /dev/null -D - --max-time 20 "https://${BUCKET}.cos.${REGION}.myqcloud.com/${key}" 2>/dev/null || true)
            code=$(printf '%s' "$meta" | head -1 | awk '{print $2}')
            cache=$(printf '%s' "$meta" | tr -d '\r' | awk 'tolower($1)=="cache-control:"{ $1=""; sub(/^ /,""); print; exit }')
            echo "  ${key} -> HTTP ${code}  Cache-Control: ${cache:-<无>}"
            assets_checked=$((assets_checked + 1))
            [ "$code" = "200" ] && asset_ok=1
            [ -n "$cache" ] && assets_with_cache=$((assets_with_cache + 1))
            asset_lines="${asset_lines}$(printf -- '- `%s` — HTTP %s — Cache-Control: `%s`\n' "$key" "$code" "${cache:-<无>}")"
          done

          # 字体单独校验：既要 200，也要 **Content-Type 是 font/woff2**。
          # COS 默认 MIME 表没有 .woff2，漏了显式声明就会以 application/octet-stream
          # 提供 —— 多数浏览器容忍，但 Firefox 对字体 MIME 严格，属于静默隐患。
          font_ok=1
          fonts_checked=0
          font_lines=""
          for f in $(find ./dist/assets -type f -name '*.woff2' | head -3); do
            key="${f#./dist/}"
            meta=$(curl -s -o /dev/null -D - --max-time 20 "https://${BUCKET}.cos.${REGION}.myqcloud.com/${key}" 2>/dev/null || true)
            code=$(printf '%s' "$meta" | head -1 | awk '{print $2}')
            ctype=$(printf '%s' "$meta" | tr -d '\r' | awk 'tolower($1)=="content-type:"{ $1=""; sub(/^ /,""); print; exit }')
            echo "  ${key} -> HTTP ${code}  Content-Type: ${ctype:-<无>}"
            fonts_checked=$((fonts_checked + 1))
            if [ "$code" != "200" ] || [ "${ctype:-}" != "font/woff2" ]; then font_ok=0; fi
            font_lines="${font_lines}$(printf -- '- `%s` — HTTP %s — Content-Type: `%s`\n' "$key" "$code" "${ctype:-<无>}")"
          done

          {
            echo "## 部署结果"
            echo ""
            echo "- 访问地址: ${site}"
            echo "- 上传文件数: $(find ./dist -type f | wc -l)"
            echo "- 入口页全部 200: $([ "$html_ok" = "1" ] && echo '是' || echo "否 ->${html_failed}")"
            echo "- 资源缓存头: ${assets_with_cache}/${assets_checked} 已生效"
            echo "- 字体 Content-Type 正确: $([ "$font_ok" = "1" ] && echo "是（${fonts_checked} 个）" || echo '否')"
            echo ""
            echo "### 资源响应头实测"
            echo ""
            printf '%s' "$asset_lines"
            echo ""
            echo "### 字体响应头实测"
            echo ""
            printf '%s' "$font_lines"
          } >> "$GITHUB_STEP_SUMMARY"

          # 判定：页面必须可达，缓存头必须生效，字体 MIME 必须正确。
          # 注意字体这条：Content-Type 错成 application/octet-stream 时多数浏览器
          # 仍能渲染，站点看起来完全正常，所以只有**断言**才能拦住它。
          if [ "$html_ok" != "1" ]; then
            verdict="FAIL-页面不可达"
          elif [ "$assets_checked" -gt 0 ] && [ "$assets_with_cache" -eq 0 ]; then
            verdict="FAIL-缓存头未生效"
          elif [ "$font_ok" != "1" ]; then
            verdict="FAIL-字体MIME不正确"
          else
            verdict="OK"
          fi

          # 把部署报告写入公开可读的 deploy-report.txt，便于用一次 HTTP 请求确认结果，
          # 无需翻看 Actions 日志。注意：只写入元数据，绝不写入任何密钥。
          report="deploy-report.txt"
          {
            echo "status=${verdict}"
            echo "time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "commit=${GITHUB_SHA:0:7}"
            echo "site=${site}"
            echo "files=$(find ./dist -type f | wc -l)"
            echo "pages_ok=$([ "$html_ok" = "1" ] && echo yes || echo "no${html_failed}")"
            echo "assets_cache=${assets_with_cache}/${assets_checked}"
            echo "fonts_ok=$([ "$font_ok" = "1" ] && echo "yes(${fonts_checked})" || echo no)"
            echo "sync_delete=${INPUT_SYNC_DELETE:-false}"
          } > "${report}"

          echo "::group::部署报告 ${report}"
          cat "${report}"
          echo "::endgroup::"
          cat "${report}" >> "$GITHUB_STEP_SUMMARY"

          # 报告也要上传，但此时凭据即将删除，单独明确处理失败
          if ! coscmd upload "${report}" "/${report}" -y -H '{"Cache-Control":"no-cache"}'; then
            echo "::warning::部署报告上传失败（不影响站点内容）"
          fi
          rm -f "${report}"

          if [ "$verdict" = "OK" ]; then
            echo "::notice::部署验证通过：页面可达、资源缓存头生效、字体 MIME 正确"
          elif [ "$html_ok" != "1" ]; then
            echo "::error::页面验证失败：以下入口页不是 200:${html_failed}"
            rm -f ~/.cos.conf
            exit 1
          elif [ "$font_ok" != "1" ]; then
            echo "::error::字体 Content-Type 不是 font/woff2（见 Summary 里的字体响应头实测）。"
            echo "::error::检查 deploy-cos.yml 中「上传字体」那一步是否仍在，以及 COS 是否覆盖了该头。"
            rm -f ~/.cos.conf
            exit 1
          else
            echo "::error::缓存头未生效：检查了 ${assets_checked} 个资源，没有任何一个返回 Cache-Control。"
            echo "::error::请把运行页面的 Summary 发给助手定位。"
            rm -f ~/.cos.conf
            exit 1
          fi

          # 清掉 runner 上的临时凭据文件
          rm -f ~/.cos.conf
          echo "上传完成"
