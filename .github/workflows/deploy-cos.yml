name: Deploy to Tencent COS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cos-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 不指定 version：版本由 package.json 的 packageManager 字段决定
          # （"pnpm@11.19.0"）。同时指定两处会让 action 直接报
          # "Multiple versions of pnpm specified" 并中止。
          # 同时关闭它自带的 install，统一由下面的 Build 步骤执行，
          # 以便使用 --frozen-lockfile。
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        env:
          VITE_MEDIA_BASE_URL: ${{ vars.VITE_MEDIA_BASE_URL }}

      - name: Install coscmd
        run: python3 -m pip install --upgrade coscmd

      - name: Upload to COS
        env:
          SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          REGION: ${{ secrets.TENCENT_COS_REGION }}
        run: |
          set -euo pipefail

          # 注意：本步骤的环境变量名是 SECRET_ID / SECRET_KEY / BUCKET / REGION
          # （由上面的 env: 映射而来），不要用 GitHub 上的 Secret 名去读。
          missing=""
          [ -z "${SECRET_ID:-}" ]  && missing="$missing TENCENT_CLOUD_SECRET_ID"
          [ -z "${SECRET_KEY:-}" ] && missing="$missing TENCENT_CLOUD_SECRET_KEY"
          [ -z "${BUCKET:-}" ]     && missing="$missing TENCENT_COS_BUCKET"
          [ -z "${REGION:-}" ]     && missing="$missing TENCENT_COS_REGION"
          if [ -n "$missing" ]; then
            echo "::error::以下 Secrets 未配置或为空:$missing"
            echo "::error::请在仓库 Settings → Secrets and variables → Actions 的 Secrets 页签中添加（注意不是 Variables 页签）。"
            exit 1
          fi

          # GitHub 不会自动去掉首尾空白，带空格/换行的值会让 coscmd 报 AccessDenied。
          # 只回显 Secret 名称，不回显值本身。
          blank=""
          for pair in "SECRET_ID:TENCENT_CLOUD_SECRET_ID" "SECRET_KEY:TENCENT_CLOUD_SECRET_KEY" "BUCKET:TENCENT_COS_BUCKET" "REGION:TENCENT_COS_REGION"; do
            var="${pair%%:*}"
            name="${pair##*:}"
            eval "value=\${$var}"
            trimmed="${value#"${value%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            if [ "$value" != "$trimmed" ]; then
              blank="$blank $name"
            fi
          done
          if [ -n "$blank" ]; then
            echo "::error::以下 Secrets 首尾含空格/Tab/换行，请重新编辑去掉:$blank"
            exit 1
          fi

          case "$REGION" in
            ap-*) ;;
            *) echo "::warning::COS 地域 '$REGION' 不常见，请确认填写正确（广州为 ap-guangzhou，上海为 ap-shanghai）" ;;
          esac
          case "$BUCKET" in
            *-*) ;;
            *) echo "::warning::桶名 '$BUCKET' 不含 APPID，COS 桶名应为“名称-APPID”全称" ;;
          esac

          coscmd config -a "${SECRET_ID}" -s "${SECRET_KEY}" -b "${BUCKET}" -r "${REGION}"

          echo "::group::本地待上传文件（dist 目录树）"
          find ./dist -type f | sort
          echo "文件总数: $(find ./dist -type f | wc -l)  总字节: $(du -sb ./dist | cut -f1)"
          echo "::endgroup::"

          # -d 打开 debug 日志，让每个文件的上传/跳过都可见。
          # 只依赖 coscmd 最基础的递归上传语法，不传语义不完全确定的参数。
          echo "::group::coscmd upload"
          coscmd -d upload -r ./dist/ /
          echo "::endgroup::"

          echo "::group::上传后桶内对象（coscmd list）"
          if ! coscmd list -a -r; then
            echo "::warning::coscmd list 执行失败，无法列出对象"
          fi
          echo "::endgroup::"

          # 以 COS 侧的真实 HTTP 响应验证，避免只看 coscmd 的自述结果。
          # 同时探测静态网站端点与默认端点：任一返回 200 即视为上传成功，
          # 以免「静态网站功能未开启」被误判成上传失败。
          site_url="https://${BUCKET}.cos-website.${REGION}.myqcloud.com/index.html"
          api_url="https://${BUCKET}.cos.${REGION}.myqcloud.com/index.html"
          ok=0
          for url in "${site_url}" "${api_url}"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${url}" || echo "000")
            echo "  ${url} -> HTTP ${code}"
            [ "$code" = "200" ] && ok=1
          done

          if [ "$ok" = "1" ]; then
            echo "::notice::上传验证通过：COS 侧已能返回 index.html"
          else
            echo "::error::上传验证失败：两个端点都没返回 200，说明对象没有落到桶根目录。"
            echo "::error::请把上面两个 group 的日志（本地文件清单 + coscmd list 结果）发给助手定位。"
            rm -f ~/.cos.conf
            exit 1
          fi

          # 清掉 runner 上的临时凭据文件
          rm -f ~/.cos.conf
          echo "上传完成"
