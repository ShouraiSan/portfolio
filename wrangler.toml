name = "portfolio-media"
main = "worker/src/index.js"
compatibility_date = "2026-09-18"
workers_dev = true

routes = [
  { pattern = "kensym15.dpdns.org", custom_domain = true }
]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "video"

[[r2_buckets]]
binding = "photo"
bucket_name = "photo"
remote = true

[[ratelimits]]
name = "PHOTO_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[vars]
# 摄影页图片 API 的可信来源白名单。
# 注意必须同时包含静态网站端点与默认端点：
#   静态网站端点 https://<bucket>.cos-website.<region>.myqcloud.com  —— 页面渲染用
#   默认端点     https://<bucket>.cos.<region>.myqcloud.com          —— 直接访问资源/预览用
# 两者 host 不同，缺任意一个都会让对应访问方式下的图片请求 403。
# "null" 用于浏览器在部分上下文（沙箱 iframe、部分扩展）发送 Origin: null 的情况；
# 安全边界仍由 Referer 校验保证，缺少 Referer 的请求一律拒绝。
#
# 自定义域名 kensym15.top 必须同时列出裸域与 www：两者 host 不同，
# 浏览器发出的 Origin 也会不同，缺任意一个都会是 403 + CORS 报错。
#
# 双节点部署说明：
#   https://kensym15.top            国内入口（当前指向 GitHub Pages；未备案，暂不能指向大陆 COS）
#   https://<bucket>.cos-website... 境外/香港节点（腾讯云 COS）
# 两个域名都提供同一套页面，因此本白名单必须同时保留两者的全部变体，
# 否则其中一侧的摄影图片会 403。日后新增或更换节点域名，务必同步更新此处。
#
# 香港节点（ap-hongkong）无需 ICP 备案即可绑定自定义域名，是当前选定的境外节点；
# 大陆节点（ap-shanghai）即使不再作为站点来源，也保留在列表内，
# 以便直接访问该端点预览时图片仍可加载。
ALLOWED_ORIGINS = "https://kensym15.top,https://www.kensym15.top,https://photo-hk-1331415098.cos-website.ap-hongkong.myqcloud.com,https://photo-hk-1331415098.cos.ap-hongkong.myqcloud.com,https://photo-1331415098.cos-website.ap-shanghai.myqcloud.com,https://photo-1331415098.cos.ap-shanghai.myqcloud.com,https://kensym15.dpdns.org,https://portfolio-media.jlmafuture.workers.dev,https://shouraisan.github.io,http://127.0.0.1:5173,http://localhost:5173,null"
PORTFOLIO_ORIGIN = "https://shouraisan.github.io/portfolio/"
