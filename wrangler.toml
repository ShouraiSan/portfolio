name = "portfolio-media"
main = "worker/src/index.js"
compatibility_date = "2026-09-18"
workers_dev = true

routes = [
  { pattern = "kensym15.dpdns.org", custom_domain = true }
]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "video"

[[r2_buckets]]
binding = "photo"
bucket_name = "photo"
remote = true

[[ratelimits]]
name = "PHOTO_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[vars]
# 摄影页图片 API 的可信来源白名单。
# 注意必须同时包含静态网站端点与默认端点：
#   静态网站端点 https://<bucket>.cos-website.<region>.myqcloud.com  —— 页面渲染用
#   默认端点     https://<bucket>.cos.<region>.myqcloud.com          —— 直接访问资源/预览用
# 两者 host 不同，缺任意一个都会让对应访问方式下的图片请求 403。
# "null" 用于浏览器在部分上下文（沙箱 iframe、部分扩展）发送 Origin: null 的情况；
# 安全边界仍由 Referer 校验保证，缺少 Referer 的请求一律拒绝。
ALLOWED_ORIGINS = "https://photo-1331415098.cos-website.ap-shanghai.myqcloud.com,https://photo-1331415098.cos.ap-shanghai.myqcloud.com,https://kensym15.dpdns.org,https://portfolio-media.jlmafuture.workers.dev,https://shouraisan.github.io,http://127.0.0.1:5173,http://localhost:5173,null"
PORTFOLIO_ORIGIN = "https://shouraisan.github.io/portfolio/"
